# Production / staging stack (ADR 0005, ARCHITECTURE §13–14, docs/release/RUNBOOK-DEPLOY.md).
# Secrets come only from .env.prod (git-ignored; template: .env.prod.example). Always run with
#   docker compose --env-file .env.prod -f docker-compose.prod.yml <command>
# so that ${VAR} interpolation reads .env.prod (env_file alone does not interpolate).
#
# Services: db, migrate (one-shot), api, worker, web (nginx + TLS), backup (daily encrypted
# pg_dump to an S3-compatible bucket such as Alibaba OSS, 14-day retention).
name: wcrm

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '20m', max-file: '5' }

x-db-urls:
  app: &database_url postgres://${DB_APP_USER:-wcrm_app}:${DB_APP_PASSWORD:?set DB_APP_PASSWORD}@db:5432/${POSTGRES_DB:-wcrm}
  owner: &database_url_owner postgres://${DB_OWNER_USER:-wcrm_owner}:${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-wcrm}

# Application configuration shared by migrate, api and worker (apps/api/src/config.ts).
x-app-env: &app_env
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-prod}
  APP_BASE_URL: https://${DOMAIN:?set DOMAIN}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: UTC
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Santiago}
  # eDo sync (ADR 0007): read-only token, from the deploy secret store (never in the repo).
  EDO_ACCESS_TOKEN: ${EDO_ACCESS_TOKEN:-}
  API_HOST: 0.0.0.0
  API_PORT: '3000'
  TRUST_PROXY: 'true'
  CORS_ORIGINS: ''
  DATABASE_URL: *database_url
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  DB_SSL: 'false'
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY (openssl rand -base64 32)}
  # ADM-01: MFA is mandatory; the API refuses to start in production with MFA_REQUIRED=false.
  MFA_REQUIRED: 'true'
  COOKIE_SECURE: 'true'
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-wc_sid}
  SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-12}
  SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-7}
  RATE_LIMIT_GLOBAL_PER_MIN: ${RATE_LIMIT_GLOBAL_PER_MIN:-300}
  RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-5}
  LOGIN_MAX_FAILED: ${LOGIN_MAX_FAILED:-10}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-19456}
  ARGON2_TIME_COST: ${ARGON2_TIME_COST:-2}
  MAIL_DRIVER: ${MAIL_DRIVER:-console}
  MAIL_FROM: ${MAIL_FROM:-CRM WhaleCloud LatAm <crm@example.com>}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  STORAGE_DRIVER: local
  FILES_DIR: /data/files
  JOBS_TIMEZONE: ${JOBS_TIMEZONE:-America/Santiago}

services:
  db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wcrm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_OWNER_USER: ${DB_OWNER_USER:-wcrm_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-wcrm_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
      CREATE_TEST_DB: 'false'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 2g }
    networks: [back]

  # One-shot: migrations + idempotent base seed (calendars, holidays, RACI, settings, FX, admin).
  # Deliberately NOT restart: unless-stopped (it must exit 0 so api/worker can start).
  migrate:
    image: ${REGISTRY:-ghcr.io/whoismanib}/whalecloud-crm-api:${IMAGE_TAG:?set IMAGE_TAG}
    command: ['sh', '-c', 'node dist/migrate.js && node dist/db/seed/seed.js']
    restart: 'no'
    environment:
      <<: *app_env
      DATABASE_URL_MIGRATIONS: *database_url_owner
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      disable: true # one-shot; its exit code gates api and worker
    deploy:
      resources:
        limits: { cpus: '1', memory: 512m }
    networks: [back]

  api:
    <<: *restart
    image: ${REGISTRY:-ghcr.io/whoismanib}/whalecloud-crm-api:${IMAGE_TAG:?set IMAGE_TAG}
    command: ['node', 'dist/server.js']
    environment:
      <<: *app_env
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - files:/data/files
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/readyz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '1', memory: 1g }
    networks: [back, front]

  worker:
    <<: *restart
    image: ${REGISTRY:-ghcr.io/whoismanib}/whalecloud-crm-api:${IMAGE_TAG:?set IMAGE_TAG}
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app_env
      DATABASE_URL_MIGRATIONS: *database_url_owner
      WORKER_ENABLED: 'true'
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - files:/data/files
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # The worker has no HTTP port: check that its DB connection works and pg-boss is installed.
      test:
        - CMD
        - node
        - -e
        - "const c=new (require('pg').Client)({connectionString:process.env.DATABASE_URL_MIGRATIONS});c.connect().then(()=>c.query('select 1 from pgboss.version')).then(()=>process.exit(0),()=>process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: '1', memory: 768m }
    networks: [back]

  web:
    <<: *restart
    image: ${REGISTRY:-ghcr.io/whoismanib}/whalecloud-crm-web:${IMAGE_TAG:?set IMAGE_TAG}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-/etc/ssl/crm}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-/var/www/acme}:/var/www/acme:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128m }
    networks: [front]

  backup:
    <<: *restart
    image: ${REGISTRY:-ghcr.io/whoismanib}/whalecloud-crm-backup:${IMAGE_TAG:?set IMAGE_TAG}
    build: { context: ., dockerfile: docker/backup/Dockerfile }
    environment:
      TZ: ${BACKUP_TZ:-America/Santiago}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set BACKUP_ENCRYPTION_KEY}
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: ${POSTGRES_DB:-wcrm}
      PGUSER: ${DB_OWNER_USER:-wcrm_owner}
      PGPASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?set BACKUP_S3_ENDPOINT}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-oss-cn-hongkong}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?set BACKUP_S3_BUCKET}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
      BACKUP_S3_ADDRESSING_STYLE: ${BACKUP_S3_ADDRESSING_STYLE:-virtual}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?set BACKUP_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?set BACKUP_S3_SECRET_ACCESS_KEY}
    volumes:
      - backups:/backups
    healthcheck:
      # crond alive and last successful backup < 26 h old (docker/backup/healthcheck.sh)
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256m }
    # `back` is internal (no egress): `egress` lets the backup reach the OSS endpoint.
    networks: [back, egress]

volumes:
  pgdata: {}
  files: {}
  backups: {}

networks:
  front: {}
  back: { internal: true }
  egress: {}
