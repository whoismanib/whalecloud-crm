# Production / staging nginx (docker-compose.prod.yml mounts it over the image's default.conf).
# TLS terminates here; certificates are mounted read-only at /etc/nginx/certs (issued on the host
# by certbot or acme.sh; see docs/release/RUNBOOK-DEPLOY.md §4). The SPA and /api proxy match
# apps/web/nginx/default.conf.

# Port 80: ACME http-01 challenges, the container healthcheck and a redirect to HTTPS.
server {
  listen 80 default_server;
  server_name _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
  }

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;
  server_tokens off;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /metrics { return 404; }
  location = /healthz { return 404; }
  location = /readyz { return 404; }

  # Public health probe for deploy smoke tests and uptime monitors: API + database.
  location = /api/health {
    access_log off;
    proxy_pass http://api:3000/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
